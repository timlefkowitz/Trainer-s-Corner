[package]
name = "trainers_corner_marketplace_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
diesel = { version = "2.1", features = ["postgres", "r2d2"] }
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
r2d2 = "0.8"
env_logger = "0.10" # Optional, for logging
openid = "0.9.4"
reqwest = { version = "0.11", features = ["blocking", "multipart"] }
anyhow = "1.0"
cookie = "0.14"
log = "0.4"
pretty_env_logger = "0.4"
tokio = { version = "1", features = [ "full" ] }
uuid = { version = "0.8", features = [ "v4" ] }
url = "2.4"
futures = "0.3.31"
diesel_json = "0.2"
actix-cors = "0.6"
